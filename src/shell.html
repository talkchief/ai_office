<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cloud AI Office</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23151414'/%3E%3Cpath d='M20 44h25a9 9 0 0 0 1-17.9A12 12 0 0 0 23.2 28 8 8 0 0 0 20 44z' fill='%23F4F1EA'/%3E%3Crect x='27' y='34' width='4' height='6' rx='1' fill='%23151414'/%3E%3Crect x='34' y='31' width='4' height='9' rx='1' fill='%23151414'/%3E%3C/svg%3E">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root {
    --cream: #FDFFF8; --ink: #151414; --grey: #5A5A5A;
    --hairline: rgba(21,20,20,.12);
    --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
    --ui: Inter, -apple-system, "Helvetica Neue", sans-serif;
    --ease: cubic-bezier(.2,.8,.2,1);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(120% 90% at 50% 30%, #FDFFF8 55%, #F2F3EA 100%);
    font-family: var(--ui); color: var(--ink);
  }
  /* camera mode (#cam=1 / V): mid-tone studio backdrop so a filmed TV doesn't blow out —
     cream pods and cards read as bright objects instead of dissolving into white */
  body.cam {
    background: radial-gradient(120% 90% at 50% 30%, #B6B3A8 45%, #8F8C83 100%);
  }
  #scene { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }

  /* top bar */
  #topbar {
    position: fixed; top: 0; left: 0; right: 0; height: 52px;
    display: flex; align-items: center; gap: 14px; padding: 0 20px;
    background: color-mix(in srgb, var(--cream) 88%, transparent);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
    z-index: 24; /* V3: stays crisp above the company-board dim */
  }
  #topbar .brand { font-family: var(--serif); font-size: 21px; letter-spacing: .04em; }
  #topbar .brand .ver { font-size: 13px; letter-spacing: .16em; color: var(--grey); vertical-align: 3px; margin-left: 2px; }
  #topbar .tag {
    font-size: 11px; letter-spacing: .14em; color: var(--grey);
    border: 1px solid var(--hairline); border-radius: 99px; padding: 4px 10px;
  }
  #topbar .sp { flex: 1; }
  #clock { font-family: var(--serif); font-size: 20px; font-variant-numeric: tabular-nums; }

  #overviewBtn {
    position: fixed; top: 66px; left: 20px; z-index: 23; /* V3: above the dept board */
    font-family: var(--ui); font-size: 12px; letter-spacing: .1em;
    background: var(--ink); color: var(--cream); border: 0; border-radius: 99px;
    padding: 9px 16px; cursor: pointer; opacity: 0; transform: translateY(-6px);
    pointer-events: none; transition: all .4s var(--ease);
  }
  #overviewBtn.show { opacity: 1; transform: none; pointer-events: auto; }
  #overviewBtn:hover { background: #000; }
  #overviewBtn.right { left: auto; right: 448px; } /* rail on the left → button moves right, clear of the task panel */

  /* zoom controls — big, obvious, camera-friendly */
  #zoomCtl {
    position: fixed; right: 448px; bottom: 20px; z-index: 10; /* V3.3: left of the task panel */
    display: flex; flex-direction: column; gap: 6px;
  }
  #zoomCtl button {
    width: 42px; height: 42px; border-radius: 50%; cursor: pointer;
    background: color-mix(in srgb, var(--cream) 94%, transparent);
    border: 1px solid var(--hairline); color: var(--ink);
    font-size: 19px; line-height: 1;
    box-shadow: 0 8px 22px rgba(21,20,20,.12);
    transition: all .4s var(--ease);
  }
  #zoomCtl button:hover { background: var(--ink); color: var(--cream); border-color: var(--ink); }
  #zoomCtl button.rot { font-size: 17px; margin-top: 2px; }

  /* dept badges — zoom-out layer */
  .badge {
    position: absolute; left: 0; top: 0; pointer-events: auto; cursor: pointer;
    background: color-mix(in srgb, var(--cream) 96%, transparent);
    border: 1px solid var(--hairline); border-radius: 16px;
    box-shadow: 0 12px 30px rgba(21,20,20,.10);
    padding: 12px 18px 10px; text-align: center; min-width: 138px;
    transition: box-shadow .4s var(--ease);
    will-change: transform, opacity;
  }
  .badge:hover { box-shadow: 0 16px 40px rgba(21,20,20,.16); }
  /* M4 thinking sweep: the dept the brain is "thinking about" glows in its chip colour */
  .badge.sweepglow {
    box-shadow: 0 0 0 1.5px var(--sw), 0 14px 44px -8px var(--sw), 0 12px 30px rgba(21,20,20,.10);
  }
  .badge .b-name {
    font-size: 11px; letter-spacing: .16em; color: var(--ink);
    display: flex; align-items: center; justify-content: center; gap: 7px;
  }
  .badge .dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
  .badge .b-count { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin-top: 3px; }
  .badge .b-num { font-family: var(--serif); font-size: 38px; line-height: 1.05; }
  .badge .b-lab { font-size: 9.5px; letter-spacing: .18em; color: var(--grey); }

  /* agent name pills — zoom-in layer; clickable → agent modal */
  .pill {
    position: absolute; left: 0; top: 0; display: none;
    background: color-mix(in srgb, var(--cream) 94%, transparent);
    border: 1px solid var(--hairline); border-radius: 99px;
    box-shadow: 0 6px 16px rgba(21,20,20,.10);
    padding: 4px 11px; font-size: 10.5px; letter-spacing: .09em; white-space: nowrap;
    will-change: transform, opacity;
    pointer-events: auto; cursor: pointer;
    transform-origin: 50% 100%;
    transition: box-shadow .4s var(--ease), border-color .4s var(--ease);
  }
  .pill:hover { border-color: var(--ink); box-shadow: 0 8px 22px rgba(21,20,20,.18); }
  .pill .star { color: #C8A438; margin-right: 4px; }

  /* MCP logo ring labels + click tooltip */
  .mcpl {
    position: absolute; left: 0; top: 0; display: none;
    background: color-mix(in srgb, var(--cream) 92%, transparent);
    border: 1px solid var(--hairline); border-radius: 99px;
    padding: 2px 9px; font-size: 9px; letter-spacing: .16em; font-weight: 600;
    color: var(--grey); white-space: nowrap; pointer-events: none;
    will-change: transform, opacity;
  }
  .connl {
    position: absolute; left: 0; top: 0;
    display: flex; align-items: center; gap: 6px;
    background: color-mix(in srgb, var(--cream) 95%, transparent);
    border: 1.5px solid var(--ink); border-radius: 99px;
    padding: 3px 12px; font-size: 9.5px; letter-spacing: .2em; font-weight: 700;
    white-space: nowrap; pointer-events: none;
    box-shadow: 0 6px 16px rgba(21,20,20,.10);
    transform-origin: 50% 100%;
    will-change: transform, opacity;
  }
  .connl .dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
  /* top-bar connector strip — the demo hook: familiar brand logos ARE the header, with
     data beaming from them down into the departments */
  #topconn { display: flex; align-items: center; gap: 7px; margin-left: 4px; }
  /* V3.5: inside a department the strip centres in the bar and names the dept it feeds */
  #topconn.focus { position: absolute; left: 50%; transform: translateX(-50%); margin: 0; }
  /* V3.1: the model layer — Claude + ChatGPT run the office headless; wired to the Brain */
  #topmodels { display: flex; align-items: center; gap: 7px; margin-right: 14px; }
  #topmodels .tc-lab .dot { background: var(--ink); }
  #topconn .tc-lab, #topmodels .tc-lab {
    display: flex; align-items: center; gap: 6px; margin-right: 4px;
    font-size: 9.5px; letter-spacing: .2em; font-weight: 700; color: var(--grey);
    white-space: nowrap;
  }
  #topconn .tc-lab .dot, #topmodels .tc-lab .dot {
    width: 7px; height: 7px; border-radius: 50%; background: #2E8B57; display: inline-block;
  }
  #topconn img, #topmodels img {
    width: 27px; height: 27px; border-radius: 7px; display: block; cursor: pointer;
    opacity: 0; transform: translateY(-9px) scale(.6);
    animation: tcin .45s var(--ease) var(--d, 0s) forwards;
  }
  #topconn img.in, #topmodels img.in { animation: none; opacity: 1; transform: none; }
  #topconn img.tpulse, #topmodels img.tpulse { animation: tpulse .6s var(--ease); opacity: 1; }
  /* V3.1: a real server that is present but not usable — there, but grey, with a reason on hover */
  #topconn img.off.in { opacity: .32; filter: grayscale(1); }
  #topconn img.st-needs-auth.in { outline: 1.5px solid #E0A020; outline-offset: 1px; }
  #topconn .tc-none { font-family: var(--ui); font-size: 9.5px; letter-spacing: .08em; color: var(--grey); white-space: nowrap; }
  @keyframes tcin { to { opacity: 1; transform: none; } }
  @keyframes tpulse {
    45% { transform: scale(1.38); filter: drop-shadow(0 0 9px rgba(46,139,87,.7)); }
  }

  /* permanent connector wiring: one conduit per dept from the top bar to a pod port */
  #wires { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

  .mcp-tip {
    position: fixed; z-index: 30; pointer-events: none;
    background: color-mix(in srgb, var(--cream) 98%, transparent);
    border: 1.5px solid var(--ink); border-radius: 12px;
    padding: 8px 12px; font-size: 11px; line-height: 1.5; letter-spacing: .03em;
    box-shadow: 0 14px 34px rgba(21,20,20,.18);
    opacity: 0; transform: translateY(4px);
    transition: opacity .25s var(--ease), transform .25s var(--ease);
  }
  .mcp-tip.on { opacity: 1; transform: translateY(0); }
  .mcp-tip b { font-family: var(--serif); font-size: 13.5px; letter-spacing: 0; }
  .mcp-tip .t-live { color: #2E8B57; font-weight: 700; }

  /* billboard metrics + approval row */
  .badge .b-metrics { margin-top: 7px; border-top: 1px solid var(--hairline); padding-top: 6px; }
  .badge .m-row {
    display: flex; justify-content: space-between; align-items: baseline; gap: 14px;
    padding: 1.5px 0;
  }
  .badge .m-lab { font-size: 8.5px; letter-spacing: .14em; color: var(--grey); }
  .badge .m-val { font-family: var(--serif); font-size: 16px; transition: color .4s var(--ease); }
  .badge .m-val.flash { animation: flashGreen 1.2s var(--ease); }
  @keyframes flashGreen { 0%, 30% { color: #1E9070; } 100% { color: var(--ink); } }
  .badge .b-appr {
    display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-top: 7px; padding: 5px 8px; border-radius: 9px;
    background: rgba(242,184,75,.18); border: 1px solid rgba(242,184,75,.55);
    font-size: 9.5px; letter-spacing: .12em; font-weight: 600;
    animation: amberPulse 1.6s var(--ease) infinite;
  }
  @keyframes amberPulse {
    0%, 100% { box-shadow: 0 0 0 0 rgba(242,184,75,0); }
    50% { box-shadow: 0 0 0 6px rgba(242,184,75,.25); }
  }
  #topAppr {
    align-items: center; gap: 5px; cursor: pointer;
    font-size: 12px; font-weight: 600; letter-spacing: .06em;
    background: rgba(242,184,75,.18); border: 1px solid rgba(242,184,75,.55);
    border-radius: 99px; padding: 4px 12px;
    animation: amberPulse 1.6s var(--ease) infinite;
  }

  /* billboard header LIVE dot */
  .badge .live { width: 6px; height: 6px; border-radius: 50%; background: #C94F3D;
    margin-left: auto; animation: liveBlink 1.2s steps(1) infinite; }
  @keyframes liveBlink { 50% { opacity: 0; } }

  /* ---------- focus mode: vignette + docked side rail (frosted cream glass) ---------- */
  #vignette {
    position: fixed; inset: 0; pointer-events: none; z-index: 8;
    background: radial-gradient(ellipse at 50% 45%, transparent 32%, rgba(21,20,20,.44) 100%);
    opacity: 0; transition: opacity .7s var(--ease);
  }
  #vignette.on { opacity: 1; }
  #rail {
    position: fixed; top: 52px; bottom: 0; width: min(400px, 92vw); z-index: 20;
    background: color-mix(in srgb, var(--cream) 74%, transparent);
    backdrop-filter: blur(18px) saturate(1.15); -webkit-backdrop-filter: blur(18px) saturate(1.15);
    overflow: hidden;
    transition: transform .6s var(--ease);
  }
  #rail.left  { left: 0;  border-right: 1px solid var(--hairline); box-shadow: 30px 0 80px rgba(21,20,20,.14); transform: translateX(-105%); }
  #rail.right { right: 0; border-left: 1px solid var(--hairline);  box-shadow: -30px 0 80px rgba(21,20,20,.14); transform: translateX(105%); }
  #rail.open  { transform: translateX(0); }
  .rview {
    position: absolute; inset: 0; display: flex; flex-direction: column;
  }
  #railDept { padding: 18px 18px 14px; display: flex; flex-direction: column; gap: 10px; }
  /* V3.4: the rail is a chat box — billboard, the department's agents, then the conversation.
     (Recent Activity is gone; the Task Status panel on the right carries the work.) */
  #railAgents { display: flex; gap: 6px; flex-wrap: wrap; flex: none; }
  #railAgents .ag {
    display: flex; align-items: center; gap: 6px; border: 1.5px solid; border-radius: 99px; cursor: pointer;
    font-family: var(--serif); font-size: 13px; color: var(--ink); padding: 3px 10px 3px 4px;
    transition: box-shadow .3s var(--ease), transform .3s var(--ease);
  }
  #railAgents .ag .star { color: #C8A438; font-size: 10px; margin-right: -3px; }
  #railAgents .ag .ag-n { font-family: var(--ui); font-size: 8.5px; letter-spacing: .12em; font-weight: 600; }
  #railAgents .ag:hover { box-shadow: 0 6px 16px rgba(21,20,20,.14); }
  #railAgents .ag.sel { box-shadow: 0 0 0 2px var(--ink); }
  #railAgents .ag.warn { box-shadow: 0 0 0 2px #F2B84B; animation: amberPulse 1.6s var(--ease) infinite; }
  #railAgent {
    position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column;
    background: color-mix(in srgb, var(--cream) 97%, transparent);
    border: 1px solid var(--hairline); border-radius: 16px;
    box-shadow: 0 12px 30px rgba(21,20,20,.08);
    opacity: 0; transform: translateY(12px);
    transition: transform .5s var(--ease), opacity .5s var(--ease);
  }
  #rail.agentOpen #railAgent { transform: none; opacity: 1; }
  #railBack { display: none; }
  .arow.sel { border-color: var(--ink); box-shadow: 0 8px 22px rgba(21,20,20,.10); }
  /* docked billboard header (populated by the FLIP flight) */
  #railHeader {
    flex: none; border: 1px solid var(--hairline); border-radius: 16px;
    background: color-mix(in srgb, var(--cream) 92%, transparent);
    box-shadow: 0 12px 30px rgba(21,20,20,.08);
    padding: 14px 16px 12px; opacity: 0; transition: opacity .3s var(--ease);
  }
  #railHeader.show { opacity: 1; }
  #railHeader .b-name { font-size: 12.5px; letter-spacing: .16em;
    display: flex; align-items: center; gap: 8px; }
  #railHeader .dot { width: 10px; height: 10px; border-radius: 50%; }
  #railHeader .b-count { display: flex; align-items: baseline; gap: 8px; margin-top: 4px; }
  #railHeader .b-num { font-family: var(--serif); font-size: 42px; line-height: 1.05; }
  #railHeader .b-lab { font-size: 10px; letter-spacing: .18em; color: var(--grey); }
  #railHeader .b-metrics { margin-top: 8px; border-top: 1px solid var(--hairline); padding-top: 7px; }
  #railHeader .m-row { display: flex; justify-content: space-between; align-items: baseline; padding: 2.5px 0; }
  #railHeader .m-lab { font-size: 9px; letter-spacing: .14em; color: var(--grey); }
  #railHeader .m-val { font-family: var(--serif); font-size: 19px; }
  #railHeader .m-val.flash { animation: flashGreen 1.2s var(--ease); }
  #railHeader .b-appr { display: flex; align-items: center; justify-content: center; gap: 5px;
    margin-top: 8px; padding: 6px 8px; border-radius: 9px; cursor: pointer;
    background: rgba(242,184,75,.18); border: 1px solid rgba(242,184,75,.55);
    font-size: 10px; letter-spacing: .12em; font-weight: 600;
    animation: amberPulse 1.6s var(--ease) infinite; }
  #railHeader .live { width: 6px; height: 6px; border-radius: 50%; background: #C94F3D;
    margin-left: auto; animation: liveBlink 1.2s steps(1) infinite; }
  /* agent activity rows — cascade in */
  .r-sec { flex: none; font-size: 9.5px; letter-spacing: .18em; color: var(--grey); margin: 16px 2px 8px; }
  .arow {
    display: flex; align-items: center; gap: 10px; padding: 10px 12px; margin-bottom: 8px;
    border: 1px solid var(--hairline); border-radius: 14px;
    background: color-mix(in srgb, var(--cream) 86%, transparent);
    cursor: pointer; opacity: 0; transform: translateY(14px);
    transition: opacity .45s var(--ease), transform .45s var(--ease),
                box-shadow .3s var(--ease), border-color .3s var(--ease);
  }
  .arow.in { opacity: 1; transform: none; }
  .arow:hover { border-color: var(--ink); box-shadow: 0 8px 22px rgba(21,20,20,.10); }
  .arow .av { width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--serif); font-size: 14px; color: var(--ink); }
  .arow .a-main { flex: 1; min-width: 0; }
  .arow .a-name { font-size: 10.5px; letter-spacing: .1em; font-weight: 600;
    display: flex; gap: 5px; align-items: center; }
  .arow .a-name .star { color: #C8A438; }
  .arow .a-line { font-size: 11px; color: var(--grey); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
  .arow .a-st { font-size: 8.5px; letter-spacing: .1em; color: var(--grey); flex: none; }
  .arow .a-st.warn { color: #B4830B; font-weight: 700; }
  #railBack {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    border: 1px solid var(--hairline); background: none; cursor: pointer;
    font-size: 17px; line-height: 1; color: var(--ink); transition: all .3s var(--ease);
  }
  #railBack:hover { background: var(--ink); color: var(--cream); }
  #rail .mh { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px 0; }
  #rail .mh-dot { width: 11px; height: 11px; border-radius: 50%; flex: none; margin-top: 7px; }
  #rail .mh-name { font-family: var(--serif); font-size: 22px; line-height: 1.15; letter-spacing: .02em; }
  #rail .mh-name .star { color: #C8A438; font-size: 16px; }
  #rail .mh-role { font-size: 10.5px; letter-spacing: .14em; color: var(--grey); text-transform: uppercase; }
  #rail .mh-tag { padding: 4px 18px 0; font-size: 12px; color: var(--grey); line-height: 1.35; }
  #rail .mtabs { display: flex; gap: 4px; padding: 12px 18px 0; border-bottom: 1px solid var(--hairline); }
  #rail .mtabs button {
    font-family: var(--ui); font-size: 10.5px; letter-spacing: .14em; font-weight: 600;
    background: none; border: 0; border-bottom: 2px solid transparent;
    padding: 8px 12px; cursor: pointer; color: var(--grey); transition: all .4s var(--ease);
  }
  #rail .mtabs button.on { color: var(--ink); border-bottom-color: var(--ink); }
  body:not(.live-office) #rail .mtabs { display: none; }
  #rail .mpane { flex: 1; display: flex; flex-direction: column; min-height: 0; }
  #mMsgs { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 9px;
    scroll-behavior: smooth; min-height: 120px; border-top: 1px solid var(--hairline); margin-top: 10px; }
  .m-agent { align-self: flex-start; max-width: 86%; background: #fff;
    border: 1px solid var(--hairline); border-radius: 14px 14px 14px 4px;
    padding: 9px 12px; font-size: 12.5px; line-height: 1.45; white-space: pre-wrap; }
  .m-user { align-self: flex-end; max-width: 86%; background: var(--ink); color: var(--cream);
    border-radius: 14px 14px 4px 14px; padding: 9px 12px; font-size: 12.5px; line-height: 1.45; }
  .m-work { font-family: Menlo, monospace; font-size: 10.5px; color: var(--grey); padding: 0 2px; }
  .m-work .wi { margin-right: 5px; }
  .m-file { align-self: flex-start; width: 88%; background: #fff; border: 1px solid var(--hairline);
    border-radius: 12px; padding: 9px 12px; cursor: pointer; transition: box-shadow .4s var(--ease); }
  .m-file:hover { box-shadow: 0 6px 18px rgba(21,20,20,.10); }
  .m-file .f-head { display: flex; align-items: center; gap: 8px; }
  .m-file .f-name { font-family: Menlo, monospace; font-size: 11.5px; font-weight: 600; }
  .m-file .f-meta { font-size: 10px; color: var(--grey); margin-top: 2px; }
  .m-file pre { display: none; margin-top: 9px; padding: 10px; background: #151414; color: #E6E8DE;
    border-radius: 8px; font-size: 10px; line-height: 1.5; overflow-x: auto; max-height: 240px; overflow-y: auto; }
  .m-file.exp pre { display: block; }
  .m-appr { align-self: flex-start; width: 88%; background: rgba(242,184,75,.10);
    border: 1px solid rgba(242,184,75,.6); border-radius: 12px; padding: 11px 13px; }
  .m-appr .a-who { font-size: 9.5px; letter-spacing: .14em; color: #8a6414; text-transform: uppercase; }
  .m-appr .a-ask { font-family: var(--serif); font-size: 15.5px; line-height: 1.3; margin: 5px 0 10px; }
  .m-appr .a-btns { display: flex; gap: 8px; }
  .m-appr button { flex: 1; font-size: 10px; letter-spacing: .12em; font-weight: 600;
    border-radius: 99px; padding: 7px 0; cursor: pointer; transition: all .4s var(--ease); }
  .m-appr .a-yes { background: var(--ink); color: var(--cream); border: 1px solid var(--ink); }
  .m-appr .a-yes:hover { background: #000; }
  .m-appr .a-no { background: transparent; border: 1px solid var(--hairline); color: var(--ink); }
  .m-appr .a-no:hover { border-color: var(--ink); }

  /* tickets riding the walkways: Brain → desk, desk → desk */

.pill:not(.is-idle) { border-radius: 14px; padding: 7px 12px 6px; border: 1.5px solid var(--sc, var(--hairline)); box-shadow: 0 6px 16px rgba(21,20,20,.10); }
.pill:not(.is-idle) .p-tag { display: inline-flex; }
.pill:not(.is-idle) .p-sub:not(:empty) { display: block; }
.pill:not(.is-idle) .p-bar[style=""], .pill:not(.is-idle) .p-bar:not([style]) { display: block; }
.pill.is-working .p-tag::before, .pill.is-supervising .p-tag::before { content: ''; width: 8px; height: 8px; border: 1.5px solid currentColor; border-right-color: transparent; border-radius: 50%; animation: space-spin 1.1s linear infinite; }
.pill.is-supervising { padding: 8px 12px; }

.live-office .pill.is-supervising::after { content: none; }
/* the Program Manager pill: slim, gold hairline, state and where it is heading */

.pill.program-manager-pill .pm-st { display: flex; align-items: center; gap: 6px; font: 700 8.5px var(--ui); letter-spacing: .14em; color: var(--grey); border: 1px solid var(--hairline); border-radius: 99px; padding: 3px 9px 3px 7px; white-space: nowrap; }

/* day and night follow the clock: the page ground shifts with the phase (the scene relights itself) */
body[data-phase=morning] { background: radial-gradient(120% 90% at 50% 30%, #FDFFF8 55%, #F2F3EA 100%); }
body[data-phase=morning]::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: linear-gradient(200deg, rgba(255,228,180,.18), transparent 60%); }
body[data-phase=evening] { background: radial-gradient(120% 90% at 50% 30%, #F8F1E6 55%, #E9E1D6 100%); }
body[data-phase=evening]::before { content: ''; position: fixed; inset: 0; pointer-events: none; z-index: 0; background: linear-gradient(160deg, rgba(255,170,110,.22), rgba(120,90,140,.12)); }
body.dark[data-phase=night]::before { content: none; }

/* ---------- design 1a/1h/1e (10 Sep 2026): Right now, hand-off chains, cards, the rail's NOW card, the result document ---------- */
.tp-now-head, .space-now-head { display: flex; align-items: baseline; justify-content: space-between; padding: 10px 2px 0; }
.tp-now-head .tp-lab, .space-h2 { font-family: var(--serif); font-size: 19px; letter-spacing: .02em; }
.tp-now, .space-now { display: flex; flex-direction: column; gap: 5px; flex: none; max-height: 34%; overflow: hidden; }
.rn-row { display: grid; grid-template-columns: auto 1fr auto; gap: 9px; align-items: center; background: #fff; border: 1px solid var(--hairline); border-radius: 12px; padding: 8px 10px; cursor: pointer; transition: border-color .3s var(--ease); }
.rn-row:hover { border-color: var(--ink); }
.rn-av { display: flex; align-items: center; }
.rn-a { width: 22px; height: 22px; border-radius: 50%; border: 1.5px solid; background: #fff; display: grid; place-items: center; font: 400 12px var(--serif); color: var(--ink); }
.rn-link { width: 14px; height: 1px; display: block; }
.rn-body { min-width: 0; }
.rn-line { display: block; font: 12px/1.3 var(--ui); color: var(--ink); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rn-meta { display: block; font: 9.5px var(--ui); letter-spacing: .08em; text-transform: uppercase; color: var(--grey); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.rn-st { font: 600 8.5px var(--ui); letter-spacing: .12em; text-transform: uppercase; border: 1px solid; border-radius: 99px; padding: 2px 7px; white-space: nowrap; }

body.dark .rn-row, body.dark .rn-a { background: #1E1F24; }
/* the hand-off chain */
.chain { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 3px 0; font: 600 8.5px var(--ui); letter-spacing: .1em; text-transform: uppercase; color: var(--grey); }
.chain .ch { display: inline-flex; align-items: center; gap: 4px; padding: 2px 7px; border: 1px solid var(--hairline); border-radius: 99px; background: #fff; white-space: nowrap; }
.chain .ch i { width: 6px; height: 6px; border-radius: 50%; background: rgba(21,20,20,.18); display: block; }
.chain .ch-done { color: #1E7A5C; border-color: rgba(30,144,112,.45); background: #E9F6EF; } .chain .ch-done i { background: #1E9070; }
.chain .ch-current { color: #151414; border-color: #151414; font-weight: 700; } .chain .ch-current i { background: #3D9575; animation: liveBlink 1.2s steps(1) infinite; }
.chain .ch-blocked { color: #B4830B; border-color: #B4830B; background: #FFF8E6; font-weight: 700; } .chain .ch-blocked i { background: #B4830B; }
.chain .ch-failed { color: #b14236; border-color: #b14236; } .chain .ch-failed i { background: #b14236; }

body.dark .chain .ch { background: #1E1F24; } body.dark .chain .ch-done { background: rgba(30,144,112,.12); }

body.dark .chain .ch-blocked { background: rgba(240,207,128,.1); }
/* live cards */
.space-job { position: relative; border-radius: 12px; }
.space-job.waiting { background: #FFF8E6; border-color: rgba(242,184,75,.7); }
.space-job.blocked { background: #FFF8E6; border-color: rgba(180,131,11,.5); }
.space-job.loading .space-card-context::before { content: ''; display: inline-block; width: 8px; height: 8px; border: 1.5px solid #B4830B; border-right-color: transparent; border-radius: 50%; margin-right: 6px; vertical-align: middle; animation: space-spin 1.1s linear infinite; }
.space-job.waiting .space-state { color: #B4830B; } .space-job.blocked .space-state { color: #b14236; }
.space-chain { display: block; margin: 2px 0; }
.space-card-actions { display: flex; align-items: center; gap: 6px; margin-top: 4px; flex-wrap: wrap; }
.space-card-actions button { background: var(--ink); color: var(--cream); border: 1px solid var(--ink); border-radius: 99px; padding: 6px 11px; font: 700 8.5px var(--ui); letter-spacing: .12em; cursor: pointer; }
.space-card-actions button.secondary { background: transparent; color: var(--ink); border-color: var(--hairline); }
.space-card-actions button.secondary:hover { border-color: var(--ink); }
.space-card-actions .space-text-action { background: none; border: 0; color: var(--grey); font: 500 10px var(--ui); letter-spacing: 0; margin-left: auto; cursor: pointer; }
.space-card-actions .space-text-action:hover { color: var(--ink); }
.space-more { display: block; width: 100%; background: none; border: 1px dashed var(--hairline); border-radius: 10px; padding: 8px; font: 500 10px var(--ui); color: var(--grey); cursor: pointer; margin: 2px 0 8px; }
.space-more:hover { border-color: var(--ink); color: var(--ink); }
.space-offline { border: 1px solid rgba(180,131,11,.5); background: #FFF8E6; color: #6C5112; border-radius: 10px; padding: 10px 12px; font: 11px/1.5 var(--ui); margin: 6px 0; }
.space-offline[hidden] { display: none; }
.space-provider { border-color: rgba(177,66,54,.5); background: #FBE9E7; color: #7A2A22; }
.space-provider { display: flex; align-items: flex-start; gap: 10px; }
/* A result that is ready and not yet opened: a green dot that breathes until the card is opened. */
.space-unread { display: inline-block; width: 9px; height: 9px; border-radius: 50%; background: #3D9575; margin: 0 7px 1px 0; vertical-align: middle; box-shadow: 0 0 0 0 rgba(61,149,117,.55); animation: unreadGlow 1.8s ease-out infinite; }
@keyframes unreadGlow { 0% { box-shadow: 0 0 0 0 rgba(61,149,117,.55); } 70% { box-shadow: 0 0 0 7px rgba(61,149,117,0); } 100% { box-shadow: 0 0 0 0 rgba(61,149,117,0); } }
@media (prefers-reduced-motion: reduce) { .space-unread { animation: none; box-shadow: 0 0 0 3px rgba(61,149,117,.25); } }
@keyframes unreadGlowWarn { 0% { box-shadow: 0 0 0 0 rgba(180,131,11,.65); } 70% { box-shadow: 0 0 0 7px rgba(180,131,11,0); } 100% { box-shadow: 0 0 0 0 rgba(180,131,11,0); } }
@keyframes unreadGlowRed { 0% { box-shadow: 0 0 0 0 rgba(177,66,54,.65); } 70% { box-shadow: 0 0 0 7px rgba(177,66,54,0); } 100% { box-shadow: 0 0 0 0 rgba(177,66,54,0); } }
.space-unread.warn { background: #B4830B; animation-name: unreadGlowWarn; }
.space-unread.red { background: #b14236; animation-name: unreadGlowRed; }
.space-card-foot b { font-weight: 600; color: var(--ink); }
.space-project.waiting .space-card-foot > span:first-child, .space-project.blocked .space-card-foot > span:first-child { white-space: normal; }
.space-project.waiting .space-card-foot, .space-project.blocked .space-card-foot { flex-wrap: wrap; }
.space-ref { font-family: var(--mg-mono, ui-monospace, monospace); font-size: .92em; color: inherit; text-decoration: underline; text-decoration-style: dotted; text-underline-offset: 2px; word-break: break-all; } .space-ref:hover { text-decoration-style: solid; }
.space-ref-dl { margin-left: 3px; text-decoration: none; font-size: .9em; opacity: .65; } .space-ref-dl:hover { opacity: 1; }
.space-notice-close { margin-left: auto; flex: none; border: 0; background: none; color: inherit; font: 18px/1 var(--ui); cursor: pointer; padding: 0 2px; opacity: .7; } .space-notice-close:hover { opacity: 1; } body.dark .space-provider { background: rgba(240,160,144,.12); color: var(--ink); }
.space-starters { display: flex; flex-direction: column; gap: 6px; margin-top: 14px; text-align: left; }
.space-starters button { display: flex; align-items: center; gap: 10px; width: 100%; background: #fff; border: 1px solid var(--hairline); border-radius: 10px; padding: 10px 12px; font: 11px var(--ui); color: var(--ink); cursor: pointer; text-align: left; }
.space-starters button b { font: 700 8.5px var(--ui); letter-spacing: .14em; flex: none; width: 74px; }
.space-starters button:hover { border-color: var(--ink); }
body.dark .space-starters button { background: #1E1F24; }
body.dark .space-job.waiting, body.dark .space-job.blocked, body.dark .space-offline { background: rgba(242,184,75,.12); color: var(--ink); }
.space-project { border-left: 3px solid #43a88e; gap: 4px; padding: 9px 12px 8px; }
.space-progress { display: flex; align-items: center; gap: 8px; min-width: 0; margin: 1px 0; }
.space-bar { flex: 0 0 88px; height: 4px; border-radius: 2px; background: color-mix(in srgb, var(--ink) 12%, transparent); overflow: hidden; }
.space-bar i { display: block; height: 100%; width: 0; background: #43a88e; border-radius: 2px; transition: width .6s ease; }
.space-pct { font: 600 10px var(--ui); color: var(--ink); flex: none; }
.space-ms { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--grey); font-size: 9.5px; }
.space-card-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-width: 0; color: var(--grey); font-size: 9px; }
.space-card-foot > span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.space-ms-list { list-style: none; margin: 2px 0 2px 12px; padding: 0 0 0 12px; border-left: 2px solid color-mix(in srgb, var(--ink) 16%, transparent); display: flex; flex-direction: column; gap: 1px; }
.space-ms-list li { display: flex; align-items: center; gap: 6px; font-size: 9.5px; line-height: 1.5; color: var(--grey); min-width: 0; }
.space-ms-list li span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.space-ms-list li i { font-style: normal; width: 11px; text-align: center; flex: none; font-weight: 700; }
.space-ms-list li em { font-style: normal; flex: none; font: 600 8px var(--ui); letter-spacing: .06em; text-transform: uppercase; }
.space-ms-list li.done { color: #248267; }
.space-ms-list li.active { color: #2A6DB5; } .space-ms-list li.active span { color: var(--ink); }
.space-ms-list li.waiting, .space-ms-list li.unplanned { color: #B4830B; } .space-ms-list li.waiting span { color: var(--ink); }
.space-ms-list li.blocked { color: #b14236; } .space-ms-list li.blocked span { color: var(--ink); }
body.dark .space-ms-list li.done { color: var(--ok); } body.dark .space-ms-list li.active { color: #7FB3F0; } body.dark .space-ms-list li.waiting, body.dark .space-ms-list li.unplanned { color: var(--warn); } body.dark .space-ms-list li.blocked { color: var(--red); }
.mf-wrap { overflow-x: auto; margin: 4px 0 12px; }
.mf { display: block; }
.mf .mf-box { fill: #fff; stroke: #B9B7AE; stroke-width: 1.5; }
.mf .mf-title { fill: var(--ink); font: 600 11px var(--ui); } .mf .mf-sub { fill: var(--grey); font: 9px var(--ui); }
.mf .done .mf-box { fill: #E9F5EE; stroke: #248267; } .mf .done .mf-sub { fill: #248267; }
.mf .active .mf-box { fill: #E6EFFA; stroke: #2A6DB5; } .mf .active .mf-sub { fill: #2A6DB5; }
.mf .waiting .mf-box { fill: #FFF8E6; stroke: #B4830B; } .mf .waiting .mf-sub, .mf .unplanned .mf-sub { fill: #B4830B; }
.mf .blocked .mf-box { fill: #FCEBE9; stroke: #b14236; } .mf .blocked .mf-sub { fill: #b14236; }
.mf .unplanned .mf-box { stroke: #B4830B; stroke-dasharray: 4 3; }
.mf .later .mf-box { stroke-dasharray: 4 3; } .mf .later .mf-title { fill: var(--grey); }
.mf .mf-edge { fill: none; stroke: #9A9A92; stroke-width: 1.4; } .mf .mf-arrow { fill: #9A9A92; }
body.dark .mf .mf-box { fill: #1E1F24; stroke: #4A4B52; } body.dark .mf .done .mf-box { fill: #16251D; stroke: #3F9C72; } body.dark .mf .active .mf-box { fill: #172232; stroke: #7FB3F0; } body.dark .mf .waiting .mf-box, body.dark .mf .unplanned .mf-box { fill: #2A2314; stroke: #E4B75B; } body.dark .mf .blocked .mf-box { fill: #2A1816; stroke: #E0786E; }

.space-project.done { border-left-color: #248267; } .space-project.done .space-bar i { background: #248267; } .space-project.done .space-state { color: #248267; }
.space-project.waiting { border-left-color: #B4830B; }
.space-project.blocked { background: #FCEBE9; border-color: rgba(177,66,54,.6); border-left-color: #b14236; }
.space-project.blocked .space-state { color: #b14236; } .space-project.blocked .space-bar i { background: #b14236; }
body.dark .space-project.blocked { background: rgba(177,66,54,.16); border-color: rgba(230,120,110,.5); border-left-color: #e0786e; }

/* demo rows read as the same cards */
.tp-row { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; padding: 10px 12px; }
.tp-row .tp-st { order: 1; margin: 0; }
.tp-row .tp-ago { order: 2; margin: 0 0 0 auto; }
.tp-row .tp-body { order: 3; flex-basis: 100%; }
.tp-row .tp-t { font-size: 12.5px; font-weight: 500; }
.tp-row.sched .tp-act { margin-top: 8px; }
/* the agent rail (design 1h): now → live draft → where this sits → chat */

/* the result document (design 1e): the deliverable beside WHO / CHECKS / LEAD'S NOTE, the decision at the bottom */

  #settingsPage h1, #settingsPage .space-h1 { font-size: 24px; }
}
/* The sheet on small screens: one page that scrolls as a whole; the handle cycles half → tall → peek (only the handle showing). */
@media (max-width: 900px) {
  #tpanel { display: block; overflow-y: auto; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; padding-top: 0; }
  #tpanel > * + * { margin-top: 9px; }
  #tpanelHandle { position: sticky; top: 0; z-index: 3; margin: 0 -14px 6px; width: calc(100% + 28px); height: 26px; background: color-mix(in srgb, var(--cream) 96%, transparent); }
  #tpanel.peek { height: 34px; overflow: hidden; padding-bottom: 0; }
  .space-now, .tp-now { max-height: none; overflow: visible; flex: none; }
  .space-jobs { overflow: visible; flex: none; max-height: none; }
  body.sheet-peek #zoomCtl { bottom: 52px; } body.sheet-tall #zoomCtl { display: none; }
  /* Name chips are never cut off on a tablet or a phone: no width cap here; the office slides a chip inside the screen (src/scene/overlays.js). */
  .pill { max-width: none; overflow: visible; text-overflow: clip; white-space: nowrap; }
  .program-manager-pill .pm-next { display: none; }
}
@media (max-width: 600px) {
  .pill:not(.is-idle) .p-sub:not(:empty) { max-width: 150px; }
}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="hud"></div>
<div id="topbar">
  <span class="brand">Cloud AI Office <span class="ver"></span></span>
  <div id="topconn"></div>
  <span class="sp"></span>
  <div id="topmodels"></div>
  <button id="themeBtn" type="button" title="Theme follows your clock. Click to preview morning, day, evening, night, then back to the clock (N)."><span class="tb-ico">☀</span><span class="tb-lab">DAY</span></button>
  <button id="claudeConnect" type="button">Connect Claude</button>
  <span id="topAppr" style="display:none">⚠ <span>0</span></span>
  <span id="clock">—</span>
</div>
<div id="vignette"></div>
<div id="rail" style="display:none">
  <div id="railDept" class="rview">
    <div id="railHeader"></div>
  <div id="railAgent" class="rview">
    <div class="mh">
      <button id="railBack">‹</button>
      <span class="mh-dot"></span>
      <div class="mh-t">
        <div class="mh-name"></div>
        <div class="mh-role"></div>
      </div>
    </div>
    <div class="mh-tag"></div>
    <div id="mNowCard" class="now-card" hidden></div>
    <div id="mRt" class="mrt" hidden></div>
    <div class="mtabs">
      <button data-tab="chat" class="on">CHAT</button>
      <button data-tab="activity">WORK</button>
    </div>
    <div id="mChat" class="mpane">
      <div id="mMsgs"></div>
      <div id="mChips"></div>
      <div class="mInput">
        <input id="mIn" placeholder="Message… leads and the Program Manager: type @ to pick a task" autocomplete="off">
        <button id="mSend">SEND</button>
      </div>
    </div>
    <div id="mAct" class="mpane" style="display:none">
      <div id="mNow"></div>
      <div id="mStats"></div>
      <div id="mChart"><div class="ch-lbl"></div><div class="ch-bars"></div></div>
      <div id="mFeed"></div>
    </div>
  </div>
  </div>
</div>
<button id="overviewBtn">◂ OVERVIEW</button>
<!-- V3.6: the full-screen Brain graph (G · click the pod · the panel strip) -->
<div id="brainOv">
  <canvas id="bvCv"></canvas>
  <div class="bv-top"><input id="bvSearch" placeholder="Search the Brain…" autocomplete="off" spellcheck="false"><div id="bvChips"></div></div>
  <div class="bv-brand">THE BRAIN <small id="bvMeta"></small></div>
  <div class="bv-pane" id="bvPane"></div>
  <div class="bv-foot">Esc closes · scroll zooms · drag pans · click a note to read it</div>
  <button id="bvClose" title="close (Esc)">✕</button>
</div>
<!-- V3.3: the Task Status panel — always on, right side -->
<div id="tpanel">
  <div class="tp-cmd">
    <div class="tp-r1">
      <button class="tp-dd" title="department"><span class="dot"></span><span class="tp-ddn">MARKETING</span></button>
      <div class="tp-menu"></div>
      <textarea class="tp-in" rows="1" placeholder="Type a task…" autocomplete="off" spellcheck="false"></textarea>
      <button class="tp-big-btn" title="open the big editor (⌘⇧E)">⤢</button>
    </div>
    <div class="tp-r2">
      <select class="tp-model" title="which model runs this (the office default unless you change it)"></select>
      <select class="tp-effort" title="how hard it thinks: Auto is the model's own level (Opus runs at high); Low to Max as Claude Code names them"></select>
      <button class="tp-rep" title="repeat on a schedule (or just say when: every weekday at 8am, …)">REPEAT</button>
      <span class="sp"></span>
      <button class="tp-add">ADD</button>
    </div>
  </div>
  <div class="tp-rep-row" hidden>
    <select class="tp-cad" title="how often"></select>
    <input type="time" class="tp-at" value="08:00" title="at what time (this machine's clock)">
    <label class="tp-ok" title="the result waits for your approval before anything is sent"><input type="checkbox" class="tp-okc" checked> needs my OK</label>
  </div>
  <div class="tp-hint"></div>
  <div class="tp-now-head"><span class="tp-lab">Right now</span><span class="tp-mode live">LIVE</span></div>
  <div class="tp-now"></div>
  <div class="tp-head"><span class="tp-lab">Work & results <span class="tp-mode" hidden></span></span><span class="tp-scope">WHOLE OFFICE</span></div>
  <div class="tp-chips"></div>
  <div class="tp-next" hidden></div>
  <div class="tp-rows"></div>
</div>
<!-- V3.7: the big editor — the task box with room for a brief -->
<div id="tpBig">
  <div class="tb-box">
    <div class="tb-head"><span class="lab">TASK FOR</span><span class="dot"></span><span class="tb-dept">MARKETING</span><span class="sp"></span><button class="tb-close" title="close (Esc)">✕</button></div>
    <textarea class="tb-in" placeholder="Write the task, or a whole brief…" autocomplete="off" spellcheck="false"></textarea>
    <div class="tb-foot"><div class="tp-hint tb-hint"></div><span class="kb"><b>⌘↵</b> adds · <b>Esc</b> closes</span><button class="tp-add tb-add">ADD</button></div>
  </div>
</div>
<div id="zoomCtl">
  <button id="zIn" title="zoom in (+)">+</button>
  <button id="zOut" title="zoom out (−)">−</button>
  <button id="zHome" title="overview (0)">⌂</button>
  <button id="zRotL" class="rot" title="turn the office (Q · or drag with the right mouse button)">↺</button>
  <button id="zRotR" class="rot" title="turn the office (E · or drag with the right mouse button)">↻</button>
</div>
<!--APP-->
</body>
</html>
