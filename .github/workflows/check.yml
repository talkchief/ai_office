name: check

# The office's own loop: build, configuration checks, the whole test suite, and an API smoke test on throwaway data.
# Runs on Linux and Windows so a change that only works on the developer's machine is caught before it ships.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
        env:
          CI: 'true'
      - name: Keep the built page as an artifact
        if: matrix.os == 'ubuntu-latest'
        uses: actions/upload-artifact@v4
        with:
          name: command-centre
          path: dist/command-centre-v2.html
          retention-days: 7
