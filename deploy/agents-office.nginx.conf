# The Agents Office. Canonical address: https://office.talkchief.io (443).
# 8443 stays listening through the transition so old links and bookmarks keep working.

# Plain HTTP → HTTPS. Named, not default_server: nginx.conf already ships a :80 server.
server {
    listen 80;
    listen [::]:80;
    server_name office.talkchief.io;
    return 308 https://office.talkchief.io$request_uri;
}

server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    listen 8443 ssl;
    listen [::]:8443 ssl;
    server_name office.talkchief.io;
    ssl_certificate /etc/nginx/kazoo-tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/kazoo-tls/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:AOTLS:10m;
    ssl_session_timeout 10m;
    server_tokens off;
    error_page 497 =301 https://office.talkchief.io$request_uri;

    # Mailgun route forwards carry the message and its attachments; the office itself
    # caps the raw body at 40 MB (serve.mjs readRawBody). nginx defaults to 1 MB, which
    # would reject them here first.
    client_max_body_size 40m;

    # Cloudflare sits in front (the name is proxied), so without this every visitor would look like a
    # Cloudflare edge: the office's sign-in rate limit, its audit trail and the access log would all
    # key on the wrong address. Trust CF-Connecting-IP, but only from Cloudflare's own ranges.
    include /etc/nginx/conf.d/cloudflare-realip.inc;

    # Public exposure: force HTTPS on later visits, refuse to be framed (an approval is one
    # click in a signed-in session), no content sniffing, and no full address in referrers.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Reached by any other name (or by IP): send callers to the canonical address.
    if ($host != office.talkchief.io) {
        return 301 https://office.talkchief.io$request_uri;
    }

    location / {
        proxy_pass http://127.0.0.1:4520;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 360s;
        proxy_send_timeout 360s;
    }
}
